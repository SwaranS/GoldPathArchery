<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My account - GoldPathArchery</title></head>
<body><main>
<h1>My account</h1>
<p>Signed in as {{ request.user.email|default:request.user.username }}</p>
<p>Select all roles that apply. Coaching access is granted separately by an administrator.</p>
<form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Save roles</button></form>
<form action="{% url 'account_logout' %}" method="post">{% csrf_token %}<button type="submit">Sign out</button></form>
</main></body></html>
